name: Windows distribution
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Exact reviewed source commit for release
        type: string
        required: false
permissions:
  contents: read
jobs:
  windows:
    name: Windows ${{ matrix.arch }} build and smoke
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 verified 2026-11-04
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7 verified 2026-11-04
        with:
          python-version: '3.13.17'
          architecture: ${{ matrix.arch }}
      - name: Install hash-locked build tools
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r packaging/requirements-build.txt
      - name: Discover complete synthetic test suite
        run: python -m unittest discover -s tests -v
      - name: Build native executable, check PE architecture and smoke test
        run: python packaging/build_windows.py --arch ${{ matrix.arch }}
      - name: Upload verified distribution and checksums
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 verified 2026-11-04
        with:
          name: windows-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
