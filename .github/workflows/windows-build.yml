name: Windows distribution
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Exact reviewed source commit for release
        type: string
        required: false
permissions:
  contents: read
jobs:
  windows:
    name: Windows ${{ matrix.arch }} build and smoke
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 verified 2026-11-04
        with:
          # PR packages identify the proposed commit, not GitHub's temporary merge.
          # This workflow has read-only permissions, no secrets and no publication.
          ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7 verified 2026-11-04
        with:
          python-version: '3.13.17'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 verified 2026-11-04
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Install locked SVG renderer
        run: npm ci --prefix packaging/icon-tools --ignore-scripts --no-audit --no-fund
      - name: Verify byte-for-byte reproduction from supplied SVGs
        run: node packaging/icon-tools/generate.mjs --check
      - name: Verify PNG/ICO integrity
        run: python packaging/verify_icons.py
      - name: Install hash-locked build tools
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r packaging/requirements-build.txt
      - name: Discover complete synthetic test suite
        run: python -m unittest discover -s tests -v
      - name: Test distribution integrity and private-package gate
        run: python -m unittest discover -s packaging -p "test_*.py" -v
      - name: Build native executable, check PE architecture/icons and smoke test
        run: python packaging/build_windows.py --arch ${{ matrix.arch }}
      - name: Upload verified distribution and checksums
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 verified 2026-11-04
        with:
          name: windows-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
  verify-distributions:
    name: Verify uploaded Windows distributions
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.17'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: windows-*
          path: verified-distributions
          merge-multiple: true
      - name: Verify uploaded bytes, source commit, PE machine and identity manifests
        env:
          EXPECTED_SHA: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}
        run: python packaging/verify_artifacts.py verified-distributions --source-sha "$EXPECTED_SHA"
