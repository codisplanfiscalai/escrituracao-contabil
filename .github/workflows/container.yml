name: Container build
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      version:
        type: string
        required: true
      base_source:
        type: string
        default: upstream
permissions:
  contents: read
  packages: read
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Test, build and export the exact tested image
        env:
          BUILD_VERSION: ${{ inputs.version }}
          BASE_SOURCE: ${{ inputs.base_source }}
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "$BASE_SOURCE" in
            upstream) ;;
            ghcr)
              trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
              printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
              ;;
            *) echo 'Invalid dependency source' >&2; exit 1 ;;
          esac
          unset GH_TOKEN
          python scripts/build.py container --version "$BUILD_VERSION" --base-source "$BASE_SOURCE"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: container
          path: artifacts/container.*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
